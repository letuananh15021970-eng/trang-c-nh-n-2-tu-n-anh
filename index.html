<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuan Anh Le - Personal Profile</title>
    <link rel="stylesheet" href="style.css">
    <!-- Nhúng FontAwesome chuẩn để hiện icon Facebook, TikTok -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <div class="background-particles"></div>

    <div class="profile-card">
        <!-- Ảnh đại diện (Sẽ chạy chuẩn khi bạn upload file avatar.jpg lên GitHub) -->
        <div class="avatar-container">
            <img src="avatar.jpg" alt="Tuan Anh Le" class="avatar" onerror="this.src='https://dicebear.com'">
            <div class="status-dot"></div>
        </div>

        <h1 class="name">Tuan Anh Lê</h1>
        <p class="tagline">@kobtjhets1 • Creator & Developer</p>
        
        <p class="bio">
            "Dòng code này có thể có bug, nhưng tình cảm tớ gửi gắm nơi đây thì luôn chạy mượt mà không một lỗi nhỏ. 💫"
        </p>

        <div class="stats-container">
            <div class="stat-box">
                <i class="fa-solid fa-heart" style="color: #f43f5e;"></i>
                <span>Crush cậu</span>
            </div>
            <div class="stat-box">
                <i class="fa-solid fa-code" style="color: #38bdf8;"></i>
                <span>Web Dev</span>
            </div>
        </div>

        <!-- Sửa lại phần icon hiển thị rõ ràng -->
        <div class="social-links">
            <a href="https://www.facebook.com/profile.php?id=61574356773427&locale=vi_VN" target="_blank" class="social-btn" style="background: #1877f2;"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="https://www.tiktok.com/@kobtjhets1" target="_blank" class="social-btn" style="background: #000000;"><i class="fa-brands fa-tiktok"></i></a>
        </div>

        <button class="action-btn" id="secretBtn">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Xem điều bí mật dành cho cậu
        </button>
    </div>

    <audio id="bgMusic" src="https://soundhelix.com" loop></audio>

    <script src="script.js"></script>
</body>
</html>
